# AWS VPC Flow Logs are delivered via the existing JSON TCP / Beats pathway.
# filebeat-tcp.yml decodes them under miscbeat; 11_beats_logs.conf extracts
# miscbeat.module into event.module before this step.
filter {
  if [event][module] == "aws_vpcflow" {
    ruby {
      id => "ruby_aws_vpcflow_to_ecs"
      path => "/usr/share/logstash/malcolm-ruby/aws_vpcflow_to_ecs.rb"
      tag_on_exception => "_rubyexception_aws_vpcflow_to_ecs"
    }
  }
}
