# Optional NetFlow v9 listener, removed at startup unless explicitly enabled.
# UDP has no authentication. Restrict network access to trusted exporters.
input {
  udp {
    id => "input_netflow_v9"
    host => "0.0.0.0"
    port => "${LOGSTASH_NETFLOW_PORT:2055}"
    source_ip_fieldname => "[observer][ip]"
    receive_buffer_bytes => 4194304
    queue_size => 4096
    codec => netflow {
      versions => [9]
      target => "[netflow]"
    }
    tags => ["_malcolm_netflow", "_malcolm_beats"]
  }
}
