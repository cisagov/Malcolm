# Normalize decoded NetFlow before routing to the existing beats pipeline.
filter {
  if "_malcolm_netflow" in [tags] {
    ruby {
      id => "ruby_netflow_to_ecs"
      path => "/usr/share/logstash/malcolm-ruby/netflow_to_ecs.rb"
      tag_on_exception => "_rubyexception_netflow_to_ecs"
    }
  }
}
