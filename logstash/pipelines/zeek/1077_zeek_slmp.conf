filter {

  if ([log_source] == "slmp") {
    #############################################################################################################################
    # slmp.log
    # main.zeek (https://github.com/Johnbjoseph-cybersec/zeek-slmp/blob/main/scripts/main.zeek)

    if ("_jsonparsesuccess" not in [tags]) {
      dissect {
        id => "dissect_zeek_slmp"
        mapping => {
          "[message]" => "%{[zeek_cols][ts]}	%{[zeek_cols][uid]}	%{[zeek_cols][orig_h]}	%{[zeek_cols][orig_p]}	%{[zeek_cols][resp_h]}	%{[zeek_cols][resp_p]}	%{[zeek_cols][proto]}	%{[zeek_cols][frame_type]}	%{[zeek_cols][serial]}	%{[zeek_cols][network]}	%{[zeek_cols][station]}	%{[zeek_cols][module_io]}	%{[zeek_cols][multidrop]}	%{[zeek_cols][ext_station]}	%{[zeek_cols][monitoring_timer]}	%{[zeek_cols][command]}	%{[zeek_cols][command_code]}	%{[zeek_cols][subcommand]}	%{[zeek_cols][device]}	%{[zeek_cols][head_device]}	%{[zeek_cols][address]}	%{[zeek_cols][points]}	%{[zeek_cols][run_mode]}	%{[zeek_cols][clear_mode]}	%{[zeek_cols][model_name]}	%{[zeek_cols][model_code]}	%{[zeek_cols][end_code]}	%{[zeek_cols][status]}	%{[zeek_cols][rtt]}"
        }
      }

      if ("_dissectfailure" in [tags]) {
        mutate {
          id => "mutate_split_zeek_slmp"
          split => { "[message]" => "	" }
        }
        ruby {
          id => "ruby_zip_zeek_slmp"
          init => "@zeek_slmp_field_names = [ 'ts', 'uid', 'orig_h', 'orig_p', 'resp_h', 'resp_p', 'proto', 'frame_type', 'serial', 'network', 'station', 'module_io', 'multidrop', 'ext_station', 'monitoring_timer', 'command', 'command_code', 'subcommand', 'device', 'head_device', 'address', 'points', 'run_mode', 'clear_mode', 'model_name', 'model_code', 'end_code', 'status', 'rtt' ]"
          code => "event.set('[zeek_cols]', @zeek_slmp_field_names.zip(event.get('[message]')).to_h)"
        }
      }
    }

    mutate {
      id => "mutate_add_fields_zeek_slmp"
      add_field => {
        "[zeek_cols][service]" => "slmp"
      }
    }
  }

}
