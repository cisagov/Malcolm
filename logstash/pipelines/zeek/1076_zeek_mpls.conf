filter {

  if ([log_source] == "mpls_header") {
    #############################################################################################################################
    # mpls_header.log
    # types.zeek (https://github.com/idaholab/icsnpp-mpls/blob/main/scripts/types.zeek)

    # mpls_header.log is indexed as event.dataset mpls (zeek.mpls.*)
    mutate {
      id => "mutate_replace_zeek_mpls_header_log_source"
      replace => { "[log_source]" => "mpls" }
    }

    if ("_jsonparsesuccess" not in [tags]) {
      dissect {
        id => "dissect_zeek_mpls"
        mapping => {
          "[message]" => "%{[zeek_cols][ts]}	%{[zeek_cols][uid]}	%{[zeek_cols][orig_h]}	%{[zeek_cols][orig_p]}	%{[zeek_cols][resp_h]}	%{[zeek_cols][resp_p]}	%{[zeek_cols][is_orig]}	%{[zeek_cols][src_l2_addr]}	%{[zeek_cols][dst_l2_addr]}	%{[zeek_cols][vlan]}	%{[zeek_cols][inner_vlan]}	%{[zeek_cols][labels]}	%{[zeek_cols][traffic_class]}	%{[zeek_cols][time_to_live]}	%{[zeek_cols][payload]}	%{[zeek_cols][packets]}	%{[zeek_cols][last_ts]}"
        }
      }

      if ("_dissectfailure" in [tags]) {
        mutate {
          id => "mutate_split_zeek_mpls"
          split => { "[message]" => "	" }
        }
        ruby {
          id => "ruby_zip_zeek_mpls"
          tag_on_exception => "_rubyexception_zip_zeek_mpls"
          init => "@zeek_mpls_field_names = [ 'ts', 'uid', 'orig_h', 'orig_p', 'resp_h', 'resp_p', 'is_orig', 'src_l2_addr', 'dst_l2_addr', 'vlan', 'inner_vlan', 'labels', 'traffic_class', 'time_to_live', 'payload', 'packets', 'last_ts' ]"
          code => "event.set('[zeek_cols]', @zeek_mpls_field_names.zip(event.get('[message]')).to_h)"
        }
      }
    }

    mutate {
      id => "mutate_add_fields_zeek_mpls"
      add_field => {
        "[zeek_cols][service]" => "mpls"
      }
    }
  }

}
