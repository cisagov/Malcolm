filter {

  if ([log_source] == "ntp") {
    #############################################################################################################################
    # ntp.log
    # https://docs.zeek.org/en/latest/scripts/base/protocols/ntp/main.zeek.html#type-NTP::Info

    if ("_jsonparsesuccess" not in [tags]) {
      dissect {
        id => "dissect_zeek_ntp"
        mapping => {
          "[message]" => "%{[zeek_cols][ts]} %{[zeek_cols][uid]} %{[zeek_cols][orig_h]} %{[zeek_cols][orig_p]} %{[zeek_cols][resp_h]} %{[zeek_cols][resp_p]} %{[zeek_cols][version]} %{[zeek_cols][mode]} %{[zeek_cols][stratum]} %{[zeek_cols][poll]} %{[zeek_cols][precision]} %{[zeek_cols][root_delay]} %{[zeek_cols][root_disp]} %{[zeek_cols][ref_id]} %{[zeek_cols][ref_time]} %{[zeek_cols][org_time]} %{[zeek_cols][rec_time]} %{[zeek_cols][xmt_time]} %{[zeek_cols][num_exts]}"
        }
      }
      if ("_dissectfailure" in [tags]) {
        mutate {
          id => "mutate_split_zeek_ntp"
          split => { "[message]" => " " }
        }
        ruby {
          id => "ruby_zip_zeek_ntp"
          tag_on_exception => "_rubyexception_zip_zeek_ntp"
          init => "@zeek_ntp_field_names = [ 'ts', 'uid', 'orig_h', 'orig_p', 'resp_h', 'resp_p', 'version', 'mode', 'stratum', 'poll', 'precision', 'root_delay', 'root_disp', 'ref_id', 'ref_time', 'org_time', 'rec_time', 'xmt_time', 'num_exts' ]"
          code => "event.set('[zeek_cols]', @zeek_ntp_field_names.zip(event.get('[message]')).to_h)"
        }
      }
    }

    mutate {
      id => "mutate_add_fields_zeek_ntp"
      add_field => {
        "[zeek_cols][proto]" => "udp"
        "[zeek_cols][service]" => "ntp"
      }
    }

  } else if ([log_source] == "ntp_control") {
    #############################################################################################################################
    # ntp_control.log
    # https://docs.zeek.org/en/current/scripts/base/protocols/ntp/main.zeek.html#type-NTP::ControlInfo

    if ("_jsonparsesuccess" not in [tags]) {
      dissect {
        id => "dissect_zeek_ntp_control"
        mapping => {
          "[message]" => "%{[zeek_cols][ts]}  %{[zeek_cols][uid]} %{[zeek_cols][orig_h]}  %{[zeek_cols][orig_p]}  %{[zeek_cols][resp_h]}  %{[zeek_cols][resp_p]}  %{[zeek_cols][version]} %{[zeek_cols][mode]}  %{[zeek_cols][op_code]} %{[zeek_cols][sequence]}  %{[zeek_cols][status]}  %{[zeek_cols][association_id]}  %{[zeek_cols][resp_bit]}  %{[zeek_cols][err_bit]} %{[zeek_cols][more_bit]}  %{[zeek_cols][data]}  %{[zeek_cols][key_id]}  %{[zeek_cols][crypto_checksum]}"
        }
      }

      if ("_dissectfailure" in [tags]) {
        mutate {
          id => "mutate_split_zeek_ntp_control"
          split => { "[message]" => " " }
        }
        ruby {
          id => "ruby_zip_zeek_ntp_control"
          init => "@zeek_ntp_control_field_names = [ 'ts', 'uid', 'orig_h', 'orig_p', 'resp_h', 'resp_p', 'version', 'mode', 'op_code', 'sequence', 'status', 'association_id', 'resp_bit', 'err_bit', 'more_bit', 'data', 'key_id', 'crypto_checksum' ]"
          code => "event.set('[zeek_cols]', @zeek_ntp_control_field_names.zip(event.get('[message]')).to_h)"
        }
      }
    }

    mutate {
      id => "mutate_add_fields_zeek_ntp_control"
      add_field => {
        "[zeek_cols][proto]" => "udp"
        "[zeek_cols][service]" => "ntp"
      }

    }
  } else if ([log_source] == "ntp_private") {
    #############################################################################################################################
    # ntp_private.log
    # https://docs.zeek.org/en/current/scripts/base/protocols/ntp/main.zeek.html#type-NTP::PrivateInfo

    if ("_jsonparsesuccess" not in [tags]) {
      dissect {
        id => "dissect_zeek_ntp_private"
        mapping => {
          "[message]" => "%{[zeek_cols][ts]}  %{[zeek_cols][uid]} %{[zeek_cols][orig_h]}  %{[zeek_cols][orig_p]}  %{[zeek_cols][resp_h]}  %{[zeek_cols][resp_p]}  %{[zeek_cols][version]} %{[zeek_cols][mode]}  %{[zeek_cols][req_code]}  %{[zeek_cols][sequence]}  %{[zeek_cols][implementation]}  %{[zeek_cols][auth_bit]}  %{[zeek_cols][err]} %{[zeek_cols][data]}"
        }
      }

      if ("_dissectfailure" in [tags]) {
        mutate {
          id => "mutate_split_zeek_ntp_private"
          split => { "[message]" => " " }
        }
        ruby {
          id => "ruby_zip_zeek_ntp_private"
          init => "@zeek_ntp_private_field_names = [ 'ts', 'uid', 'orig_h', 'orig_p', 'resp_h', 'resp_p', 'version', 'mode', 'req_code', 'sequence', 'implementation', 'auth_bit', 'err', 'data' ]"
          code => "event.set('[zeek_cols]', @zeek_ntp_private_field_names.zip(event.get('[message]')).to_h)"
        }
      }
    }

    mutate {
      id => "mutate_add_fields_zeek_ntp_private"
      add_field => {
        "[zeek_cols][proto]" => "udp"
        "[zeek_cols][service]" => "ntp"
      }

    }
  }

} # end Filter
