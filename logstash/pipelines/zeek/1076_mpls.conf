filter {

  if ([log_source] == "mpls_header") {
    #############################################################################################################################
    # mpls_header.log
    # https://github.com/idaholab/icsnpp-mpls

    mutate {
      id => "mutate_replace_zeek_mpls_header_log_source"
      replace => { "[log_source]" => "mpls" }
    }

    if ("_jsonparsesuccess" not in [tags]) {
      dissect {
        id => "dissect_zeek_mpls_header"
        mapping => {
          "[message]" => "%{[zeek_cols][ts]}	%{[zeek_cols][labels]}	%{[zeek_cols][experimentals]}	%{[zeek_cols][bottom_of_stack]}	%{[zeek_cols][time_to_live]}"
        }
      }

      if ("_dissectfailure" in [tags]) {
        mutate {
          id => "mutate_split_zeek_mpls_header"
          split => { "[message]" => "	" }
        }
        ruby {
          id => "ruby_zip_zeek_mpls_header"
          init => "@zeek_mpls_header_field_names = [ 'ts', 'labels', 'experimentals', 'bottom_of_stack', 'time_to_live' ]"
          code => "event.set('[zeek_cols]', @zeek_mpls_header_field_names.zip(event.get('[message]')).to_h)"
        }
      }
    }

    mutate {
      id => "mutate_add_fields_zeek_mpls_header"
      add_field => {
        "[zeek_cols][service]" => "mpls"
      }
    }
  }

}
