filter {
  # Opt-in Community ID for Zeek logs with a complete TCP/UDP/SCTP tuple.
  # Keep IDs already supplied by Zeek (e.g. conn.log) unchanged.

  mutate {
    id => "mutate_add_field_env_zeek_logstash_compute_community_id"
    add_field => { "[@metadata][ENV_LOGSTASH_ZEEK_COMPUTE_COMMUNITY_ID]" => "${LOGSTASH_ZEEK_COMPUTE_COMMUNITY_ID:false}" }
  }
  if ([@metadata][ENV_LOGSTASH_ZEEK_COMPUTE_COMMUNITY_ID] == "true") {
    # Most Zeek logs have no proto column, so network.transport is missing. For
    # logs whose analyzer only runs over one transport, look it up by log type.
    # The result goes in @metadata so the stored event never claims a transport
    # that Zeek didn't log.
    if (![network][transport]) and (![network][community_id]) and [source][ip] and [destination][ip] and [source][port] and [destination][port] {
      translate {
        id => "translate_zeek_log_transport"
        source => "[log_source]"
        target => "[@metadata][inferred_transport]"
        dictionary_path => "/etc/zeek_log_transport.yaml"
      }
    }

    if [source][ip] and [destination][ip] and [source][port] and [destination][port] and ([network][transport] or [@metadata][inferred_transport]) and ![network][community_id] {
      ruby {
        id => "ruby_zeek_community_id"
        path => "/usr/share/logstash/malcolm-ruby/zeek_community_id.rb"
        tag_on_exception => "_rubyexception_zeek_community_id"
      }
    }
  }
}
