filter {
  # Opt-in Community ID for any Zeek log with a complete TCP/UDP/SCTP tuple.
  # Keep IDs already supplied by Zeek (e.g. conn.log) unchanged.
  if [source][ip] and [destination][ip] and [source][port] and [destination][port] and [network][transport] and ![network][community_id] {
    ruby {
      id => "ruby_zeek_community_id"
      path => "/usr/share/logstash/malcolm-ruby/zeek_community_id.rb"
      script_params => { "enabled" => "${LOGSTASH_ZEEK_COMPUTE_COMMUNITY_ID:false}" }
      tag_on_exception => "_rubyexception_zeek_community_id"
    }
  }
}
