filter {

  if ([log_source] == "multicast_participants") {
    #############################################################################################################################
    # multicast_participants.log
    # multicast-participants.zeek (https://docs.zeek.org/en/v9.0.0/scripts/policy/protocols/conn/multicast-participants.zeek.html#id2)

    if ("_jsonparsesuccess" in [tags]) {
      mutate {
        id => "mutate_rename_zeek_json_multicast_participants_fields"
        rename => { "[zeek_cols][cid]" => "[zeek_cols][uid]"
                    "[zeek_cols][group_addr]" => "[zeek_cols][resp_h]"
                    "[zeek_cols][group_p]" => "[zeek_cols][resp_p]" }
      }

    } else {
      dissect {
        id => "dissect_zeek_multicast_participants"
        mapping => {
          "[message]" => "%{[zeek_cols][ts]} %{[zeek_cols][uid]} %{[zeek_cols][orig_h]} %{[zeek_cols][resp_h]} %{[zeek_cols][resp_p]} %{[zeek_cols][participants]}"
        }
      }

      if ("_dissectfailure" in [tags]) {
        mutate {
          id => "mutate_split_zeek_multicast_participants"
          split => { "[message]" => " " }
        }
        ruby {
          id => "ruby_zip_zeek_multicast_participants"
          init => "@zeek_multicast_participants_field_names = [ 'ts', 'uid', 'orig_h', 'resp_h', 'resp_p', 'participants' ]"
          code => "event.set('[zeek_cols]', @zeek_multicast_participants_field_names.zip(event.get('[message]')).to_h)"
        }
      }

      mutate { id => "mutate_split_zeek_multicast_participants_commas"
               split => { "[zeek_cols][participants]" => "," } }
    }
  }
}

