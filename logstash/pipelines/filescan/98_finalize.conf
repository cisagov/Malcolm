# final adjustments before forwarding

filter {

  fingerprint {
    id => "fingerprint_filescan_hash"
    source => [ "[source][ip]",
                "[destination][ip]",
                "[firstPacket]",
                "[lastPacket]",
                "[event][module]",
                "[host][name]",
                "[file][hash][sha256]",
                "[rule][ruleset]",
                "[filescan][tree][root]",
                "[filescan][tree][node]",
                "[filescan][tree][parent]",
                "[filescan][tree][depth]",
                "[rule][name]" ]
    concatenate_sources => true
    ecs_compatibility => "v8"
    method => "MURMUR3_128"
    base64encode => true
  }

  # Capa match trees can contain integer-like constants beyond JavaScript's safe-integer range.
  # Preserve those values as strings so OpenSearch Dashboards can deserialize the document even
  # if an upstream serializer would otherwise emit the value in exponent notation.
  if [results][strelka][result][scan][capa][rules] {
    ruby {
      id => "ruby_filescan_capa_stringify_unsafe_numbers"
      tag_on_exception => "_rubyexception_filescan_capa_stringify_unsafe_numbers"
      code => '
        max_safe_integer = 9_007_199_254_740_991
        convert = nil
        convert = lambda do |value|
          case value
          when Hash
            value.each { |key, child| value[key] = convert.call(child) }
            value
          when Array
            value.map! { |child| convert.call(child) }
          when Numeric
            value.abs > max_safe_integer ? value.to_s : value
          else
            value
          end
        end

        rules = event.get("[results][strelka][result][scan][capa][rules]")
        event.set("[results][strelka][result][scan][capa][rules]", convert.call(rules))
      '
    }
  }

  ruby {
      id => "ruby_filescan_move_results_up_and_remove_parent_fields"
      tag_on_exception => "_rubyexception_filescan_move_results_up_and_remove_parent_fields"
      code => "
        Hash(event.get('[results]') || {}).each do |k, v|
          event.set('[' + k + ']', v)
        end

        # for Strelka results for archived/nested files, remove some of the zeek.files fields (which belong to the 'parent')
        [
            '[zeek][files][analyzers]',
            '[zeek][files][depth]',
            '[zeek][files][duration]',
            '[zeek][files][extracted]',
            '[zeek][files][extracted_cutoff]',
            '[zeek][files][extracted_size]',
            '[zeek][files][ftime]',
            '[zeek][files][local_orig]',
            '[zeek][files][md5]',
            '[zeek][files][mime_type]',
            '[zeek][files][missing_bytes]',
            '[zeek][files][overflow_bytes]',
            '[zeek][files][seen_bytes]',
            '[zeek][files][sha1]',
            '[zeek][files][sha256]',
            '[zeek][files][ssdeep]',
            '[zeek][files][timedout]',
            '[zeek][files][tlsh]',
            '[zeek][files][total_bytes]'
        ].each do |field|
          event.remove(field)
        end if event.get('[filescan][tree][depth]').to_i.positive?
      "
  }

  mutate {
    id => "mutate_filescan_remove_field_useless"
    remove_field => [
      "[file][sha256]",
      "[id]",
      "[results]",
      "[metadata][record]",
      "[strelka][result][request][attributes][metadata][record]",
      "[strelka][result][file][metadata][record]",
      "[entity][raw]"
    ]
  }

}
