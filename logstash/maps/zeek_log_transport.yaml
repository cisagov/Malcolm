# Transport protocol for Zeek logs that have orig_h/orig_p/resp_h/resp_p but
# no proto column, keyed by [log_source]. Used only to compute Community ID
# when [network][transport] is absent. Only protocols whose Zeek analyzer
# runs over a single transport are listed. Logs that can be either TCP or
# UDP are omitted on purpose (see the end of this file), since a wrong
# transport produces a valid-looking but wrong Community ID.

