# Deliberately omitted #########################################################
#
# Either transport (no way to tell from the log alone):
#   ssl (DTLS is logged to ssl.log too), kerberos, ldap, ldap_search,
#   cip, cip_identity, enip, dnp3, dnp3_control, dnp3_objects,
#   omron_fins_*, roc_plus_* (sub-logs; roc_plus itself has proto), ipsec
#
# No meaningful port tuple, or not a single flow:
#   ospf (IP protocol 89), files, intel, notice, signatures, software,
#   tunnel, weird, known_*
#
# Already have a proto column (no mapping needed):
#   bestguess, c1222*, conn, conn_long, diagnostic analyzer, dns, ge_srtp,
#   genisys, hart_ip*, notice, omron_fins, profinet_io_cm, roc_plus, stun,
#   stun_nat, synchrophasor*, syslog
