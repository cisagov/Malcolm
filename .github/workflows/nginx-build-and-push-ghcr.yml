name: nginx-build-and-push-ghcr

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'nginx/**'
      - 'Dockerfiles/nginx.Dockerfile'
      - 'container-health-scripts/nginx.sh'
      - 'shared/bin/docker-uid-gid-setup.sh'
      - '.trigger_workflow_build'
      - '_config.yml'
      - '_includes/**'
      - '_layouts/**'
      - 'docs/**'
      - 'Gemfile'
      - 'README.md'
  workflow_dispatch:
  repository_dispatch:

jobs:
  test-lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get install -y --no-install-recommends lua5.4
      - name: Run normalize_uri_for_rbac regression tests
        run: lua5.4 nginx/lua/test_normalize_uri.lua

  docker:
    needs: test-lua
    uses: ./.github/workflows/docker-build-push-scan.yml
    permissions:
      packages: write
      contents: read
      security-events: write
    with:
      service: nginx-proxy
      dockerfile: ./Dockerfiles/nginx.Dockerfile
