access_by_lua_block {
    local nginx_helpers = require("nginx_auth_helpers")

    local forwarded_proto = os.getenv("NGINX_X_FORWARDED_PROTO_OVERRIDE")
    local opts = {
        redirect_uri = os.getenv("KEYCLOAK_AUTH_REDIRECT_URI"),
        discovery = os.getenv("KEYCLOAK_AUTH_URL") .. "/realms/" .. os.getenv("KEYCLOAK_AUTH_REALM") .. "/.well-known/openid-configuration",
        client_id = os.getenv("KEYCLOAK_CLIENT_ID"),
        client_secret = os.getenv("KEYCLOAK_CLIENT_SECRET"),
        session_contents = {id_token=true, access_token=true},
        ssl_verify = (os.getenv("KEYCLOAK_SSL_VERIFY") == "true") and "yes" or "no",
        accept_none_alg = false,
        accept_unsupported_alg = false,
        token_signing_alg_values_expected = "RS256",
        renew_access_token_on_expiry = true,
        revoke_tokens_on_logout = true
    }
    if forwarded_proto ~= nil and forwarded_proto ~= "" then
        opts.redirect_uri_scheme = forwarded_proto
    end

    -- lua-resty-session 4.x option schema (flat keys). Under 3.x this was a
    -- nested cookie={...} table; 4.x ignores unknown keys without raising an
    -- error, so a leftover 3.x-shaped table would silently drop the Secure
    -- flag from the session cookie. Do not re-nest these.
    --
    -- "secret" must be set explicitly and must be stable across restarts: if it
    -- is left unset, 4.x derives a per-process secret, which invalidates every
    -- live session whenever nginx restarts and breaks auth outright if
    -- worker_processes is ever raised above 1 (each worker would generate its
    -- own secret and reject cookies written by its siblings).
    --
    -- cookie_same_site is Lax, not Strict: Strict breaks every OIDC redirect
    -- flow because the browser withholds the cookie on the cross-site return
    -- from Keycloak. Only switch to None if a form_post response_mode is
    -- introduced, which would also require Secure (already set below).
    local session_opts = {
        secret = os.getenv("NGINX_SESSION_SECRET"),
        cookie_secure = true,
        cookie_http_only = true,
        cookie_same_site = "Lax",
        idling_timeout = 1800,
        rolling_timeout = 3600,
        absolute_timeout = 36000
    }
    if session_opts.secret == nil or session_opts.secret == "" then
        ngx.log(ngx.ERR, "NGINX_SESSION_SECRET is unset; refusing to use a per-process session secret")
        ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
        ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
    end

    local res, err = require("resty.openidc").authenticate(opts, nil, nil, session_opts)
    if err then
      ngx.log(ngx.ERR, "Error during authentication: " .. err)
      ngx.status = ngx.HTTP_UNAUTHORIZED
      ngx.exit(ngx.HTTP_UNAUTHORIZED)
    end

    -- check_groups_and_roles indexes token_data.preferred_username immediately,
    -- so a nil id_token would surface as a Lua runtime error (HTTP 500) on the
    -- login path rather than a clean 401. session_contents requests id_token
    -- above, but session content handling is exactly what shifted between
    -- session 3.x and 4.x, so fail closed instead of assuming it is present.
    if res == nil or res.id_token == nil then
      ngx.log(ngx.ERR, "Authentication returned no id_token")
      ngx.status = ngx.HTTP_UNAUTHORIZED
      ngx.exit(ngx.HTTP_UNAUTHORIZED)
    end

    local helper_err, username, groups, roles = nginx_helpers.check_groups_and_roles(res.id_token)
    if helper_err ~= ngx.HTTP_OK then
        ngx.status = helper_err
        ngx.exit(helper_err)
    end
    helper_err = nginx_helpers.check_rbac(res.id_token)
    if helper_err ~= ngx.HTTP_OK then
        ngx.status = helper_err
        ngx.exit(helper_err)
    end

    nginx_helpers.set_headers(username, nil, groups, roles)
}
