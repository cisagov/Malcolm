include /etc/nginx/nginx_auth_rt.conf;
# the redirect to the remote Kibana is sent from @dashboards_kibana_pivot (in nginx.conf and
# nginx_readonly.conf), entered from the CONTENT phase so the auth above runs first.
# A rewrite here would answer in the REWRITE phase, before auth. See GHSA-93g5-g9r5-g78w.
content_by_lua_block { return ngx.exec("@dashboards_kibana_pivot") }
