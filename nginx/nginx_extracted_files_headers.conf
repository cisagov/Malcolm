# Response headers for /extracted-files and /hh-extracted-files (GHSA-6c6q-2c2m-74h8).
#
# Extracted files are untrusted content carved from network traffic. The file server forces them
#   to download, but this location-level policy is the backstop: it also covers Hedgehog sensors
#   running an older file server, and any future regression upstream. No script runs on these
#   paths, which kills inline <script> in an HTML/SVG file as well as <script src> pointing at
#   another extracted file (a policy of script-src 'self' would still allow the latter).
#   The directory listing is plain links and tables, so it doesn't need script.
#
# add_header in a location discards every add_header inherited from the server block, so the
#   framing policy is re-included here. Browsers enforce each CSP header independently.
include /etc/nginx/nginx_csp_framing.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'none'; object-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; base-uri 'none'; form-action 'self'" always;
proxy_hide_header X-Content-Type-Options;
add_header X-Content-Type-Options "nosniff" always;
