# included from the @idark2dash_pivot named location, which is entered only after
# the /idark2dash location's auth has run (see GHSA-93g5-g9r5-g78w)
set $forwarded_scheme $scheme;
if ($http_x_forwarded_proto = 'https') {
    set $forwarded_scheme https;
}
rewrite (?i)^.*/idark2dash/(.*) $forwarded_scheme://$host$dashboards_prefix/app/dashboards#/view/0ad3d7c2-3441-485e-9dfe-dbb22e84e576?_g=(filters:!(),refreshInterval:(pause:!t,value:0),time:(from:$filter_start_time,to:$filter_stop_time))&_a=(description:'',filters:!((meta:(alias:!n,disabled:!f,index:'$sessions_index',key:$filter_field,negate:!f,params:(query:'$filter_value'),type:phrase),query:(match_phrase:($filter_field:'$filter_value')))),fullScreenMode:!f,options:(useMargins:!t),query:(language:lucene,query:'*'),timeRestore:!f,viewMode:view) redirect;